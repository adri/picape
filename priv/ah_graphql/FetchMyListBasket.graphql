query FetchMyListBasket($input: BasketInput, $states: [BonusSegmentState!]) { basket(input: $input) { __typename canChangeDelivery itemsInOrder { __typename position originCode isClosed allocatedQuantity quantity product { __typename ...MyListBasketProductFragment } } notes { __typename description isStrikethrough originCode position quantity searchTerm } itemsInList { __typename isStrikethrough originCode position product { __typename ...MyListBasketProductFragment } quantity } externalItems { __typename isStrikethrough originCode position product { __typename ...MyListBasketProductFragment } quantity } summary { __typename isCancellable price { __typename discount { __typename amount } totalPrice { __typename amount } priceAfterDiscount { __typename amount } priceBeforeDiscount { __typename amount } } quantity shoppingType lastUserChangeDateTime } } order { __typename delivery { __typename address { __typename street houseNumber houseNumberExtra zipCode city countryCode } date endTime startTime status id shiftCode pickupLocationId } } }
fragment MyListBasketProductFragment on Product { __typename availability { __typename availabilityLabel online { __typename status } offline { __typename status } isOrderable } category hqId id imagePack(angles: [HERO, ANGLE_2D1]) { __typename angle large { __typename height url width } medium { __typename height url width } small { __typename height url width } } listPrice { __typename amount } priceV2(states: $states) { __typename discount { __typename availability { __typename description endDate startDate } description productCount promotionType segmentId segmentType tieredOffer theme activationStatus subtitle } now { __typename amount } was { __typename amount } promotionLabel { __typename type tiers { __typename mechanism description alternateDescription originalDescription amount incentiveType count freeCount actualCount price percentage unit } } } properties { __typename code values } salesUnitSize shopType title virtualBundleProducts { __typename quantity product { __typename id } } }
