name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ hashFiles('mix.lock', '.tool-versions') }}
      - run: mix deps.get
      - run: mix check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  e2e:
    name: Screen tests
    runs-on: ubuntu-latest
    env:
      PICAPE_LOG_LEVEL: info
      E2E_SKIP_SCREENSHOTS: "1"
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('mix.lock', '.tool-versions') }}
      - run: sudo apt-get install -y inotify-tools
      - run: mix deps.get
      - run: mix compile
      - run: npm ci --no-audit --no-fund --prefix frontend
      - run: npm ci --no-audit --no-fund --prefix e2e
      - run: npx playwright install chromium
        working-directory: e2e
      - run: bin/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: tmp/
          if-no-files-found: ignore
